name: "End-to-End DevSecOps Pipeline"

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  id-token: write
  pull-requests: write
  security-events: write

jobs:
  secrets-scan:
    name: "Shift-Left Secret Detection (Gitleaks)"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  unit-tests:
    name: "Application Unit Tests (Pytest)"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r app/requirements.txt

      - name: Run Pytest
        run: |
          cd app
          PYTHONPATH=. pytest -v tests/

  iac-security:
    name: "IaC Security (Checkov & tfsec)"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.9.5"

      - name: Terraform Format Check
        run: terraform -chdir=terraform fmt -check

      - name: Terraform Initialize & Validate
        run: |
          cd terraform
          terraform init -backend=false
          terraform validate

      - name: Checkov IaC Security Scan
        uses: bridgecrewio/checkov-action@master
        with:
          directory: terraform
          framework: terraform
          output_format: cli
          soft_fail: true

      - name: tfsec Security Scanner
        uses: aquasecurity/tfsec-action@v1.0.3
        with:
          working_directory: terraform
          soft_fail: true

  container-security:
    name: "Container Build & Trivy Vulnerability Scan"
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Local Image
        run: |
          docker build -t cloud-microservice:${{ github.sha }} ./app

      - name: Run Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "cloud-microservice:${{ github.sha }}"
          format: "table"
          exit-code: "0"
          ignore-unfixed: true
          vuln-type: "os,library"
          severity: "CRITICAL,HIGH"

  k8s-manifest-validation:
    name: "Kubernetes Manifest Quality Check"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Validate Kubernetes Manifests
        run: |
          pip install pyyaml
          python3 -c "
          import yaml, glob
          for f in sorted(glob.glob('k8s/*.yaml')):
              with open(f) as stream:
                  list(yaml.safe_load_all(stream))
                  print(f'Valid YAML: {f}')
          "

  deploy-gate:
    name: "Deploy Gate & Azure Verification"
    runs-on: ubuntu-latest
    needs: [secrets-scan, iac-security, container-security, k8s-manifest-validation]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment:
      name: production
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.9.5"

      - name: Verify Plan Synthesis
        run: |
          cd terraform
          terraform init -backend=false
          terraform validate
          echo "Production deployment gate reached. All 5 DevSecOps quality gates passed successfully."
